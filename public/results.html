<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracketta | Results</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="results">
  <nav class="navbar">
    <span class="logo">Tracketta</span>
    <div class="nav-links">
      <a href="index.html">Track</a>
      <a href="history.html">History</a>
      <a href="settings.html">Settings</a>
      <a href="usage.html">Usage Rights</a>
    </div>
  </nav>

  <div class="container">
    <div class="card" id="resultCard">
      <div class="space-between">
        <div>
          <div class="section-title">Tracking summary</div>
          <h2 id="carrierLabel">Loading...</h2>
          <p class="muted" id="trackingNumberLabel"></p>
        </div>
        <div class="badge" id="statusBadge">Fetching...</div>
      </div>
      <div class="summary-grid" id="summaryGrid"></div>
    </div>

    <div class="card">
      <div class="space-between">
        <div class="section-title">Timeline</div>
        <span class="muted" id="lastUpdatedLabel"></span>
      </div>
      <div id="timelineContainer" class="timeline"></div>
    </div>

    <div id="loadingState" class="loading" style="display:none;">Loading your results...</div>
    <div id="errorState" class="error-state" style="display:none;"></div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="components/dropdown.js"></script>
  <script src="components/modal.js"></script>
  <script src="components/toast.js"></script>
  <script src="components/timeline.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script src="resultsPage.js"></script>
</body>
</html>
