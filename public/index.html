<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracketta | Track your package</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <span class="logo">Tracketta</span>
      <div class="nav-links">
        <a href="index.html" class="active">Track</a>
        <a href="history.html">History</a>
        <a href="settings.html">Settings</a>
        <a href="usage.html">Usage Rights</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card hero">
      <div>
        <h1>Track your package</h1>
        <p>UPS, FedEx, USPS, DHL, LaserShip, Amazon Logistics — all in one clean interface.</p>
      </div>
      <div class="form-row">
        <div class="input-group">
          <input type="text" id="trackingNumber" placeholder="Enter tracking number" />
          <select id="carrierSelect">
            <option value="auto">Auto detect</option>
            <option value="ups">UPS</option>
            <option value="fedex">FedEx</option>
            <option value="usps">USPS</option>
            <option value="dhl">DHL</option>
            <option value="lasership">LaserShip</option>
            <option value="amazon">Amazon Logistics</option>
          </select>
        </div>
        <button class="primary" id="trackBtn" disabled>Track package</button>
        <div id="detectedCarrier" class="muted"></div>
      </div>
    </div>
    <div class="footer-note">Stay updated with Tracketta — professional package tracking made simple.</div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="components/dropdown.js"></script>
  <script src="components/modal.js"></script>
  <script src="components/toast.js"></script>
  <script src="components/timeline.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
